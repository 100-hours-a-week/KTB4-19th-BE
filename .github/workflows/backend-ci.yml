name: Backend CI

# Pull Request에서는 검증만 한다.
# main 병합으로 발생한 push에서만 검증된 Image를 Commit SHA 앞 7자리 Tag로 ECR에 Push한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: zipsai-backend

# 같은 Pull Request에 새 Commit이 올라오면 이전 검증은 취소한다.
# main 병합 후 ECR Image 저장은 모든 SHA 이력을 남겨야 하므로 취소하지 않는다.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test, Build, Docker Image
    # 최신 main 상태 기준 Pull Request에서만 병합 전 검증을 한다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spring Boot 4.1.1과 프로젝트 Gradle Wrapper가 사용하는 Java 25를 맞춘다.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          # Gradle 의존성·Wrapper를 GitHub Actions Cache에 보관한다.
          cache: gradle

      # 실제 Backend 테스트 코드를 실행한다.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # Dockerfile 내부 Build와 별도로 Application JAR 생성이 가능한지 확인한다.
      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR에서는 Docker Image 생성 가능 여부만 확인하고 ECR에는 Push하지 않는다.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zipsai-backend:validation
          # 다음 CI 실행에서 Gradle Build·Docker Layer를 재사용한다.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-image:
    name: Main Image Build and Push
    # 병합 후에는 Test를 반복하지 않고, 최종 main Commit Image를 만들어 ECR에 저장한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PR 검증 Job에는 AWS 인증 권한을 주지 않는다.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # GitHub 화면에 표시되는 짧은 Commit SHA와 같은 앞 7자리를 ECR Tag로 사용한다.
      - name: Set short ECR image tag
        id: image-tag
        run: echo "value=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ steps.image-tag.outputs.value }}
          # PR 검증 Build와 main Image Build가 같은 Docker Layer Cache를 공유한다.
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
