name: Backend CI

# Pull Request에서는 검증만 한다.
# main 병합으로 발생한 push에서만 검증된 Image를 Commit SHA Tag로 ECR에 Push한다.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: zipsai-backend

# 같은 Pull Request에 새 Commit이 올라오면 이전 검증은 취소한다.
# main 병합 후 ECR Image 저장은 모든 SHA 이력을 남겨야 하므로 취소하지 않는다.
concurrency:
  group: backend-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test, Build, Docker Image
    # 최신 main 상태 기준 Pull Request에서만 병합 전 검증을 한다.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Spring Boot 4.1.1과 프로젝트 Gradle Wrapper가 사용하는 Java 25를 맞춘다.
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      # 실제 Backend 테스트 코드를 실행한다.
      - name: Run tests
        run: ./gradlew test --no-daemon

      # Dockerfile 내부 Build와 별도로 Application JAR 생성이 가능한지 확인한다.
      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # PR에서는 Docker Image 생성 가능 여부만 확인하고 ECR에는 Push하지 않는다.
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zipsai-backend:validation

  publish-image:
    name: Main Image Build and Push
    # 병합 후에는 Test를 반복하지 않고, 최종 main Commit Image를 만들어 ECR에 저장한다.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # PR 검증 Job에는 AWS 인증 권한을 주지 않는다.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # OIDC 토큰 전체를 출력하지 않고, IAM 신뢰 정책과 비교할 식별 정보만 확인한다.
      - name: Show OIDC claims
        run: |
          OIDC_TOKEN="$(
            curl -sS \
              -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
              | jq -r '.value'
          )"

          OIDC_TOKEN="$OIDC_TOKEN" node -e '
            const claim = JSON.parse(
              Buffer.from(process.env.OIDC_TOKEN.split(".")[1], "base64url").toString()
            );
            console.log({
              sub: claim.sub,
              aud: claim.aud,
              repository: claim.repository,
              ref: claim.ref
            });
          '

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_BACKEND_CI_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 최종 main Commit SHA를 Image Tag로 사용한다.
      - name: Build and publish Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
