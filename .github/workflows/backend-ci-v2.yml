name: Backend CI V2

# PR에서는 검증만 수행한다. staging 병합 후에는 최종 커밋을 다시 검증하고
# ECR에 운영 후보 이미지를 저장한다. ECS 배포는 별도 CD에서 수행한다.
on:
  pull_request:
    branches: [staging, main]
  push:
    branches: [staging]

permissions:
  contents: read

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 929368845727.dkr.ecr.ap-northeast-2.amazonaws.com
  ECR_REPOSITORY: zipsai-backend

# PR의 이전 실행만 취소한다. staging 이미지 이력은 모두 남긴다.
concurrency:
  group: backend-ci-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Test and Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle

      - name: Run tests
        run: ./gradlew test --no-daemon

      - name: Build application JAR
        run: ./gradlew bootJar --no-daemon

      # staging push의 Docker Build는 아래 publish-image Job에서 수행한다.
      - name: Set up Docker Buildx
        if: github.event_name == 'pull_request'
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker image
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: zipsai-backend:validation
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  publish-image:
    name: Staging Image Build and Push
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # AWS 인증은 이미지 저장 Job에만 허용한다.
    permissions:
      contents: read
      id-token: write
    outputs:
      image_tag: ${{ steps.image-tag.outputs.value }}
      image_uri: ${{ steps.image-tag.outputs.uri }}
      image_digest: ${{ steps.image-result.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          # 적용 전 Repository Variable과 staging 브랜치용 OIDC Trust Policy 설정 필요.
          role-to-assume: ${{ vars.AWS_BACKEND_CI_V2_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Set image tag
        id: image-tag
        shell: bash
        run: |
          set -euo pipefail
          image_tag="${GITHUB_SHA::7}"
          echo "value=$image_tag" >> "$GITHUB_OUTPUT"
          echo "uri=$ECR_REGISTRY/$ECR_REPOSITORY:$image_tag" >> "$GITHUB_OUTPUT"

      # Immutable ECR의 동일 커밋 재실행은 기존 이미지를 사용한다.
      # 권한·네트워크 오류는 이미지 부재로 오인하지 않고 실패 처리한다.
      - name: Check existing image
        id: existing-image
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          trap 'rm -f "$error_file"' EXIT
          if aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' \
            --output text > /dev/null 2> "$error_file"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif grep -q '(ImageNotFoundException)' "$error_file"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
          else
            cat "$error_file" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        if: steps.existing-image.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Login to Amazon ECR
        if: steps.existing-image.outputs.exists == 'false'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and publish Docker image
        if: steps.existing-image.outputs.exists == 'false'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image-tag.outputs.uri }}
          labels: org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # Production 승격 시 main SHA로 재빌드하지 않고 이 digest를 사용한다.
      - name: Record published image
        id: image-result
        env:
          IMAGE_TAG: ${{ steps.image-tag.outputs.value }}
          IMAGE_URI: ${{ steps.image-tag.outputs.uri }}
        shell: bash
        run: |
          set -euo pipefail
          digest="$(aws ecr describe-images \
            --repository-name "$ECR_REPOSITORY" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'imageDetails[0].imageDigest' --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Backend 운영 후보 이미지'
            echo "- Commit: $GITHUB_SHA"
            echo "- Image: $IMAGE_URI"
            echo "- Digest: $digest"
            echo "- 배포 식별자: $ECR_REGISTRY/$ECR_REPOSITORY@$digest"
            echo '- ECS 배포는 별도 CD에서 수행합니다.'
          } >> "$GITHUB_STEP_SUMMARY"
