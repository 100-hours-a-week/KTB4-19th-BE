spring.datasource.url=jdbc:h2:mem:auth;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
app.auth.secret=test-only-secret-32-bytes-minimum-not-for-production
app.auth.secure-cookie=false
app.auth.rate-limit=10000
spring.cache.type=jcache
spring.cache.jcache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
bucket4j.methods[0].name=invitation-code
bucket4j.methods[0].cache-name=rate-limit-buckets
bucket4j.methods[0].rate-limit.bandwidths[0].capacity=10
bucket4j.methods[0].rate-limit.bandwidths[0].time=10
bucket4j.methods[0].rate-limit.bandwidths[0].unit=minutes
spring.jpa.defer-datasource-initialization=true
app.ai.client=stub
app.conversation.closing-scheduler.enabled=false
app.conversation.reply-worker.enabled=false
app.complaint.ai-feedback-scheduler.enabled=false
app.complaint.ai-feedback.concurrency=1
app.rule-document.indexing-scheduler.enabled=false
spring.batch.job.enabled=false
app.kakao.api-key=
app.external-api.targets.ai.base-url=${app.ai.base-url:http://localhost:8000}
app.external-api.targets.ai.stage=ai_api
app.external-api.targets.ai.error-code=AI_UNAVAILABLE
app.external-api.targets.kakao.base-url=${app.kakao.base-url:https://dapi.kakao.com}
app.external-api.targets.kakao.stage=kakao_api
app.external-api.targets.kakao.error-code=KAKAO_UNAVAILABLE
app.building.coordinate-retry.cron=-
