spring.application.name=zipsai
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zipsai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.flyway.enabled=true
spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.username=${REDIS_USERNAME:}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_TLS:false}
spring.data.redis.connect-timeout=${REDIS_CONNECT_TIMEOUT:1s}
spring.data.redis.timeout=${REDIS_TIMEOUT:1s}
spring.data.redis.lettuce.shutdown-timeout=${REDIS_SHUTDOWN_TIMEOUT:1s}
spring.data.redis.repositories.enabled=false
management.health.redis.enabled=false
app.auth.secret=${JWT_SECRET}
app.auth.access-ttl=15m
app.auth.refresh-ttl=14d
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
app.auth.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.rate-limit=101
spring.cache.type=jcache
spring.cache.jcache.provider=com.github.benmanes.caffeine.jcache.spi.CaffeineCachingProvider
bucket4j.methods[0].name=invitation-code
bucket4j.methods[0].cache-name=rate-limit-buckets
bucket4j.methods[0].rate-limit.bandwidths[0].capacity=10
bucket4j.methods[0].rate-limit.bandwidths[0].time=10
bucket4j.methods[0].rate-limit.bandwidths[0].unit=minutes
app.ai.client=${AI_CLIENT:stub}
app.ai.base-url=${AI_API_URL:http://localhost:8000}
app.ai.converse-stream-path=${AI_CONVERSE_STREAM_PATH:/api/v3/ai/converse/stream}
app.ai.converse-connect-timeout=PT3S
app.ai.converse-read-timeout=PT60S
app.ai.indexing-path=${AI_INDEXING_PATH:/api/v3/ai/indexing/jobs}
app.ai.complaint-feedback-path=${AI_COMPLAINT_FEEDBACK_PATH:/api/v3/ai/complaints/feedback/batch}
app.complaint.ai-feedback-scheduler.enabled=${COMPLAINT_AI_FEEDBACK_SCHEDULER_ENABLED:false}
app.conversation.closing-scheduler.enabled=${CONVERSATION_CLOSING_SCHEDULER_ENABLED:false}
spring.batch.job.enabled=false
app.ai.api-key=${AI_API_KEY:}
spring.http.clients.connect-timeout=3s
spring.http.clients.read-timeout=60s
app.kakao.base-url=https://dapi.kakao.com
app.kakao.api-key=${KAKAO_REST_API_KEY:}
app.kakao.connect-timeout=PT1S
app.kakao.read-timeout=PT2S
app.external-api.targets.ai.base-url=${app.ai.base-url}
app.external-api.targets.ai.stage=ai_api
app.external-api.targets.ai.error-code=AI_UNAVAILABLE
app.external-api.targets.kakao.base-url=${app.kakao.base-url}
app.external-api.targets.kakao.stage=kakao_api
app.external-api.targets.kakao.error-code=KAKAO_UNAVAILABLE
app.migration.app-config-url=${MIGRATION_APPCONFIG_URL:http://localhost:2772/applications/zipsai/environments/prod/configurations/db-migration}
app.migration.worker-enabled=${MIGRATION_WORKER_ENABLED:false}
app.migration.v2-datasource.url=${MIGRATION_V2_DB_URL:}
app.migration.v2-datasource.username=${MIGRATION_V2_DB_USERNAME:}
app.migration.v2-datasource.password=${MIGRATION_V2_DB_PASSWORD:}
management.endpoints.web.base-path=/api/actuator
management.endpoints.web.exposure.include=health,prometheus
management.metrics.distribution.percentiles-histogram.http.server.requests=true
sentry.dsn=${SENTRY_DSN:}
sentry.environment=${SENTRY_ENVIRONMENT:local}
sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.1}
sentry.send-default-pii=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
