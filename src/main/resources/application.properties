spring.application.name=zipsai
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/zipsai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.properties.hibernate.timezone.default_storage=NORMALIZE
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
spring.flyway.enabled=true
app.auth.secret=${JWT_SECRET}
app.auth.access-ttl=15m
app.auth.refresh-ttl=14d
app.auth.secure-cookie=${AUTH_SECURE_COOKIE:true}
app.auth.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.rate-limit=5
app.ai.client=${AI_CLIENT:http}
app.ai.base-url=${AI_BASE_URL:http://localhost:8000}
spring.http.client.connect-timeout=3s
spring.http.client.read-timeout=30s
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
