spring.config.import=optional:file:./.env.properties
app.auth.secure-cookie=false
app.auth.allowed-origins=http://localhost:5173
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
app.ai.client=stub
app.storage.aws-region=${AWS_REGION:ap-northeast-2}
app.storage.aws-profile=${AWS_PROFILE:}
app.storage.upload-bucket=${S3_UPLOAD_BUCKET:zipsai-prod-uploads}
app.storage.presigned-url-ttl-seconds=${S3_PRESIGNED_URL_TTL_SECONDS:300}
app.storage.max-file-size=${S3_MAX_FILE_SIZE:10485760}
