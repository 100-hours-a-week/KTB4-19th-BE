server.port=${LOADTEST_PORT:8081}
spring.datasource.url=jdbc:mysql://localhost:${MYSQL_PORT:3307}/zipsai_loadtest?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
spring.threads.virtual.enabled=${VIRTUAL_THREADS:false}
app.ai.client=stub
server.tomcat.mbeanregistry.enabled=true
management.tracing.enabled=true
management.tracing.sampling.probability=1.0
management.opentelemetry.tracing.export.otlp.endpoint=http://localhost:4318/v1/traces
management.otlp.metrics.export.enabled=true
management.otlp.metrics.export.url=http://localhost:4318/v1/metrics
management.otlp.metrics.export.step=5s
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles-histogram.hikaricp.connections=true
management.metrics.distribution.percentiles-histogram.jdbc.query=true
