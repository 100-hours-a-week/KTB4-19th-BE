# Local development only. Credentials are shared with the team for local use.
services:
  db:
    image: mysql:8.4.11
    environment:
      MYSQL_DATABASE: zipsai
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-mysql}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysql --protocol=TCP -h 127.0.0.1 -uroot -D $$MYSQL_DATABASE -e 'SELECT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  backend:
    build: .
    environment:
      DB_URL: jdbc:mysql://db:3306/zipsai?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=false
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:-mysql}
      JWT_SECRET: ${JWT_SECRET:-local-development-only-jwt-secret-change-before-deployment-2026}
      AUTH_SECURE_COOKIE: "false"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"
    depends_on:
      db:
        condition: service_healthy

volumes:
  mysql-data:
